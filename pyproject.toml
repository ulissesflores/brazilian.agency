[project]
name = "brazilian-agency"
version = "0.1.0"
description = "Portal of the Open Source Brazilian Intelligence Agency: open-source intelligence on Brazilian politics and public data. Independent; no link to any government body."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Carlos Ulisses Flores" }]
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D102", "D103"]
"sync_dossie.py" = ["E501"]  # page metadata strings are data, one per line

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.interrogate]
fail-under = 100
exclude = ["tests"]
ignore-init-module = true
